name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_name: Telegram-Discord-Bot-linux-x64
            archive_name: Telegram-Discord-Bot-linux-x64.tar.gz
          - runner: windows-2025
            artifact_name: Telegram-Discord-Bot-windows-x64
            archive_name: Telegram-Discord-Bot-windows-x64.zip
          - runner: macos-15-intel
            artifact_name: Telegram-Discord-Bot-macos-x64
            archive_name: Telegram-Discord-Bot-macos-x64.tar.gz
          - runner: macos-15
            artifact_name: Telegram-Discord-Bot-macos-arm64
            archive_name: Telegram-Discord-Bot-macos-arm64.tar.gz

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm --onefile --name Telegram-Discord-Bot CLI.py

      - name: Package Unix artifact
        if: runner.os != 'Windows'
        run: |
          mkdir -p "release/${{ matrix.artifact_name }}"
          cp "dist/Telegram-Discord-Bot" "release/${{ matrix.artifact_name }}/"
          cp README.md LICENSE "release/${{ matrix.artifact_name }}/"
          tar -czf "${{ matrix.archive_name }}" -C release "${{ matrix.artifact_name }}"

      - name: Package Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "release/${{ matrix.artifact_name }}"
          Copy-Item "dist/Telegram-Discord-Bot.exe" "release/${{ matrix.artifact_name }}/"
          Copy-Item README.md, LICENSE "release/${{ matrix.artifact_name }}/"
          Compress-Archive -Path "release/${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes
